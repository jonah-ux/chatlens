name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Annotated tag to publish"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Refresh annotated release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Invalid release tag: expected vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, subprocess, tomllib
          tag = os.environ["RELEASE_TAG"]
          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match project version {version}")
          tag_type = subprocess.check_output(["git", "cat-file", "-t", f"refs/tags/{tag}"], text=True).strip()
          if tag_type != "tag":
              raise SystemExit("release tag must be annotated")
          tag_commit = subprocess.check_output(["git", "rev-parse", f"refs/tags/{tag}^{{}}"], text=True).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if tag_commit != head:
              raise SystemExit("release tag does not identify the checked-out HEAD")
          print(f"Release identity verified: {tag} -> {head}")
          PY
      - name: Build distributions and checksums
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Verify wheel consumer
        run: |
          python -m venv .release-wheel
          .release-wheel/bin/python -m pip install dist/*.whl
          .release-wheel/bin/chatlens --version
          .release-wheel/bin/chatlens --help
      - name: Verify source consumer
        run: |
          python -m venv .release-sdist
          .release-sdist/bin/python -m pip install dist/*.tar.gz
          .release-sdist/bin/chatlens --version
          .release-sdist/bin/chatlens --help
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Upload distributions for PyPI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$RELEASE_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_REPOSITORY $RELEASE_TAG" \
            --generate-notes

  pypi:
    # Off until PyPI trusted publishing is configured for this repository.
    # Enable by setting the repository variable PYPI_PUBLISH to "true".
    if: vars.PYPI_PUBLISH == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
