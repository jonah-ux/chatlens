name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test fixtures
        run: python -m unittest discover -s tests -v
      - name: Audit public release surface
        run: python scripts/audit_public_surface.py --json
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build --sdist --wheel
      - name: Verify source conformance resource
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          relative = "conformance/agent-systems-lab.json"
          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
              members = [member for member in archive.getmembers() if member.name.split("/", 1)[-1] == relative]
              assert len(members) == 1 and members[0].isfile(), "owner manifest missing or duplicated"
              assert archive.extractfile(members[0]).read() == Path(relative).read_bytes(), "owner manifest bytes changed"
          print("Source distribution contains the exact owner conformance manifest")
          PY
      - name: Install wheel and verify CLI
        run: |
          python -m pip install --no-deps dist/*.whl
          chatlens --version
          chatlens --help
          python demos/demo.py
      - name: Verify fresh sdist installation
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/chatlens-sdist"
          "$RUNNER_TEMP/chatlens-sdist/bin/python" -m pip install --no-deps dist/chatlens-*.tar.gz
          "$RUNNER_TEMP/chatlens-sdist/bin/chatlens" --version
          "$RUNNER_TEMP/chatlens-sdist/bin/chatlens" --help
          "$RUNNER_TEMP/chatlens-sdist/bin/python" demos/demo.py
