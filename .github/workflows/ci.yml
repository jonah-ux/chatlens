name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test fixtures
        run: python -m unittest discover -s tests -v
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build --sdist --wheel
      - name: Install wheel and verify CLI
        run: |
          python -m pip install --no-deps dist/*.whl
          chatlens --version
          chatlens --help
          python demos/demo.py
      - name: Verify fresh sdist installation
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/chatlens-sdist"
          "$RUNNER_TEMP/chatlens-sdist/bin/python" -m pip install --no-deps dist/chatlens-*.tar.gz
          "$RUNNER_TEMP/chatlens-sdist/bin/chatlens" --version
          "$RUNNER_TEMP/chatlens-sdist/bin/chatlens" --help
          "$RUNNER_TEMP/chatlens-sdist/bin/python" demos/demo.py
