<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Chatlens synthetic demo workflow</title>
  <desc id="desc">A four-step local workflow: synthetic Codex, Claude Code, and Hermes stores are discovered, indexed, searched, and turned into a work card with an explicit not verified boundary.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1423"/><stop offset="1" stop-color="#101d31"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21314a"/></pattern>
  </defs>
  <rect width="1280" height="560" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="22" fill="url(#grid)" opacity=".35"/>
  <text x="54" y="70" fill="#eef5ff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="750">One demo run, four inspectable steps</text>
  <text x="56" y="104" fill="#9fb1c9" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17">Chatlens keeps the source coverage, cached search, and verification boundary visible.</text>
  <rect x="56" y="150" width="250" height="250" rx="16" fill="#111d30" stroke="#2a3b55"/>
  <circle cx="88" cy="184" r="12" fill="#6ee7c2" fill-opacity=".2" stroke="#6ee7c2"/>
  <text x="113" y="190" fill="#edf4ff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700">01 / Discover</text>
  <text x="80" y="235" fill="#b6c5db" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">Codex      ✓ readable</text>
  <text x="80" y="266" fill="#b6c5db" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">Claude     ✓ readable</text>
  <text x="80" y="297" fill="#b6c5db" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">Hermes     ✓ readable</text>
  <text x="80" y="354" fill="#6ee7c2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">chatlens-list/v1</text>
  <path d="M326 275h54m-14-8 14 8-14 8" fill="none" stroke="#6ee7c2" stroke-width="2" stroke-linecap="round"/>
  <rect x="396" y="150" width="250" height="250" rx="16" fill="#111d30" stroke="#2a3b55"/>
  <circle cx="428" cy="184" r="12" fill="#6ee7c2" fill-opacity=".2" stroke="#6ee7c2"/>
  <text x="453" y="190" fill="#edf4ff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700">02 / Index</text>
  <text x="420" y="245" fill="#edf4ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="28" font-weight="700">3 indexed</text>
  <text x="420" y="282" fill="#b6c5db" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15">failed: 0</text>
  <text x="420" y="314" fill="#b6c5db" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15">partial: false</text>
  <text x="420" y="354" fill="#6ee7c2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">chatlens-index/v1</text>
  <path d="M666 275h54m-14-8 14 8-14 8" fill="none" stroke="#6ee7c2" stroke-width="2" stroke-linecap="round"/>
  <rect x="736" y="150" width="250" height="250" rx="16" fill="#111d30" stroke="#2a3b55"/>
  <circle cx="768" cy="184" r="12" fill="#6ee7c2" fill-opacity=".2" stroke="#6ee7c2"/>
  <text x="793" y="190" fill="#edf4ff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700">03 / Search</text>
  <text x="760" y="245" fill="#edf4ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">release workflow</text>
  <text x="760" y="282" fill="#b6c5db" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15">matches: 3</text>
  <text x="760" y="314" fill="#b6c5db" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15">cached and labeled</text>
  <text x="760" y="354" fill="#6ee7c2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">chatlens-search/v1</text>
  <path d="M1006 275h54m-14-8 14 8-14 8" fill="none" stroke="#6ee7c2" stroke-width="2" stroke-linecap="round"/>
  <rect x="1076" y="150" width="148" height="250" rx="16" fill="#111d30" stroke="#2a3b55"/>
  <circle cx="1108" cy="184" r="12" fill="#f6c85f" fill-opacity=".2" stroke="#f6c85f"/>
  <text x="1133" y="190" fill="#edf4ff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700">04</text>
  <text x="1096" y="245" fill="#edf4ff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700">Work card</text>
  <text x="1096" y="286" fill="#b6c5db" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15">goal + activity</text>
  <text x="1096" y="316" fill="#b6c5db" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15">tools + input</text>
  <text x="1096" y="357" fill="#f6c85f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">not_verified</text>
  <line x1="56" y1="449" x2="1224" y2="449" stroke="#283a54"/>
  <text x="56" y="490" fill="#8fa4bf" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15">SYNTHETIC FIXTURE ONLY · NO LIVE TRANSCRIPT CLAIMS</text>
  <text x="1224" y="490" text-anchor="end" fill="#6ee7c2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">CHATLENS DEMO</text>
</svg>
